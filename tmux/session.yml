# do not modify these
root: ../
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RUN_TYPE=simulation
  - export UAV_TYPE=x500
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
  - export USE_SIM_TIME="true"
startup_window: status
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - tmux set -g mouse on && export ZENOH_CONFIG=/root/ros2_ws/src/ctu_mrs_test/config/zenoh_config.json && ros2 run rmw_zenoh_cpp rmw_zenohd --config /root/ros2_ws/src/ctu_mrs_test/config/zenoh_config.json

  - gazebo:
      layout: tiled
      panes:
        - sleep 3 && ros2 launch mrs_uav_gazebo_simulator simulation.launch.py
        #- 'waitForGazebo && sleep 2; gz topic -t /gui/track -m gz.msgs.CameraTrack -p "track_mode: 2 follow_target { name: \"$UAV_NAME\" }"'

  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh

  - spawn:
      layout: tiled
      panes:
        # - 'waitForGazebo && ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "value: 1 --$UAV_TYPE"'
        # - 'waitForGazebo && ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "value: 1 --$UAV_TYPE --enable-rangefinder"'
        - 'waitForGazebo && ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "value: 1 --x500 --pos 0 0 0.5 0 --enable-ground-truth --enable-rangefinder"'

  - hw_api:
      layout: tiled
      panes:
        - waitForGazebo && sleep 6 && ros2 launch mrs_uav_px4_api api.launch.py

  - core:
      layout: tiled
      panes:
        - waitForHwApi && ros2 launch mrs_uav_core core.launch.py
          platform_config:=./config/x500.yaml
          custom_config:=./config/custom_config.yaml
          world_config:=./config/world_config.yaml
          network_config:=./config/network_config.yaml

  - takeoff:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_autostart automatic_start.launch.py custom_config:=./config/automatic_start.yaml
        #- waitForCore && ./tmux/takeoff.sh

  - code:
      layout: tiled
      panes:
        - waitForCore && ./src/fase0/phase0_master.py

  - terminal:
      layout: tiled
      panes:
        - /bin/bash

  #- rviz:
  #    layout: tiled
  #    panes:
  #      - waitForCore && ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true
  #- layout:
  #    layout: tiled
  #    panes:
  #      - waitForCore && sleep 2; ~/.i3/layout_manager.sh ./layout.json
